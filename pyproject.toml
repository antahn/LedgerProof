[project]
name = "ledgerproof"
version = "0.1.0"
description = "Append-only double-entry payments ledger with a DB-enforced money-conservation invariant, attacked by a fault-injection harness."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "stripe>=12",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "prometheus-client>=0.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# harness/ is a top-level package outside the src layout: the adversary is not
# shipped with the product it attacks.
pythonpath = ["."]
markers = [
    "chaos: starts real processes (ingest, worker) and a real database",
    "clocks: drives the live Stripe sandbox via test clocks (slow, needs sk_test_)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
